<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Indicator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-lg p-8 w-full max-w-2xl border border-slate-100">
        <div class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-slate-800 mb-2">Student Performance Indicator</h1>
            <p class="text-slate-500">Enter student details to predict mathematics performance.</p>
        </div>
        
        <form action="/predictdata" method="post" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Gender</label>
                    <select name="gender" required class="w-full rounded-md border border-slate-300 px-3 py-2 text-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-800 focus:border-slate-800 bg-white">
                        <option value="" disabled selected>Select Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Race / Ethnicity</label>
                    <select name="ethnicity" required class="w-full rounded-md border border-slate-300 px-3 py-2 text-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-800 focus:border-slate-800 bg-white">
                        <option value="" disabled selected>Select Ethnicity</option>
                        <option value="group A">Group A</option>
                        <option value="group B">Group B</option>
                        <option value="group C">Group C</option>
                        <option value="group D">Group D</option>
                        <option value="group E">Group E</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Parental Level of Education</label>
                    <select name="parental_level_of_education" required class="w-full rounded-md border border-slate-300 px-3 py-2 text-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-800 focus:border-slate-800 bg-white">
                        <option value="" disabled selected>Select Education</option>
                        <option value="some high school">Some High School</option>
                        <option value="high school">High School</option>
                        <option value="some college">Some College</option>
                        <option value="associate's degree">Associate's Degree</option>
                        <option value="bachelor's degree">Bachelor's Degree</option>
                        <option value="master's degree">Master's Degree</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Lunch Type</label>
                    <select name="lunch" required class="w-full rounded-md border border-slate-300 px-3 py-2 text-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-800 focus:border-slate-800 bg-white">
                        <option value="" disabled selected>Select Lunch</option>
                        <option value="standard">Standard</option>
                        <option value="free/reduced">Free/Reduced</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Test Preparation Course</label>
                    <select name="test_preparation_course" required class="w-full rounded-md border border-slate-300 px-3 py-2 text-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-800 focus:border-slate-800 bg-white">
                        <option value="" disabled selected>Select Course</option>
                        <option value="none">None</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Reading Score (0-100)</label>
                    <input type="number" name="reading_score" min="0" max="100" required class="w-full rounded-md border border-slate-300 px-3 py-2 text-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-800 focus:border-slate-800">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Writing Score (0-100)</label>
                    <input type="number" name="writing_score" min="0" max="100" required class="w-full rounded-md border border-slate-300 px-3 py-2 text-slate-700 focus:outline-none focus:ring-2 focus:ring-slate-800 focus:border-slate-800">
                </div>
            </div>

            <div class="pt-4">
                <button type="submit" class="w-full bg-slate-800 text-white font-semibold py-3 px-4 rounded-md hover:bg-slate-700 transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-slate-800 focus:ring-offset-2">
                    Predict Performance
                </button>
            </div>
        </form>
        
        {% if results %}
        <div class="mt-8 p-4 bg-slate-100 border border-slate-200 rounded-md text-center">
            <h2 class="text-xl font-semibold text-slate-800">
                Predicted Math Score: <span class="text-blue-600">{{ results }}</span>
            </h2>
        </div>
        {% endif %}
    </div>
</body>
</html>
